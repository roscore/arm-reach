[package]
name = "ar_web"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Robot arm reach & manipulability explorer (WebAssembly UI)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ar_core = { path = "../ar_core" }
wasm-bindgen = "0.2"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlInputElement",
  "HtmlSelectElement", "HtmlButtonElement", "Node", "NodeList", "DomTokenList", "CssStyleDeclaration",
  "Event", "EventTarget", "MouseEvent", "PointerEvent", "WheelEvent", "KeyboardEvent", "Navigator", "Storage",
  "CanvasRenderingContext2d", "DomRect", "TouchEvent", "AddEventListenerOptions",
  "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlBuffer", "WebGlVertexArrayObject",
  "WebGlUniformLocation", "TextMetrics", "WebGlContextAttributes", "console", "MediaQueryList",
]
